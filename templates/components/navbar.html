{% load i18n %}

<header class="site-header sticky-top" x-data="{ open: false }" @keydown.escape.window="open = false">
  <nav class="navbar navbar-expand-lg navbar-custom" aria-label="{% translate 'Primary navigation' %}">
    <div class="container-fluid px-4">
      <button
        class="navbar-toggler"
        type="button"
        aria-controls="site-navigation"
        aria-expanded="false"
        aria-label="{% translate 'Toggle navigation' %}"
        @click="open = !open"
        :aria-expanded="open.toString()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="mobile-menu-backdrop"
        x-show="open"
        x-transition.opacity
        x-cloak
        aria-hidden="true"
        @click="open = false"
      ></div>

      <div
        id="site-navigation"
        class="navbar-collapse"
        :class="{ 'is-open': open }"
        x-show="open"
        x-transition:enter="mobile-menu-enter"
        x-transition:enter-start="mobile-menu-enter-start"
        x-transition:enter-end="mobile-menu-enter-end"
        x-transition:leave="mobile-menu-leave"
        x-transition:leave-start="mobile-menu-leave-start"
        x-transition:leave-end="mobile-menu-leave-end"
        x-cloak
      >
        <ul class="navbar-nav" @click="open = false">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'home' %}" @click="open = false">
              {% translate "Home" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'about' %}" @click="open = false">
              {% translate "About" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'new_here' %}" @click="open = false">
              {% translate "New here?" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'giving' %}" @click="open = false">
              {% translate "Give" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'sermons:list' %}" @click="open = false">
              {% translate "Sermons" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'communications:subscribe' %}" @click="open = false">
              {% translate "Stay connected" %}
            </a>
          </li>
        </ul>
      </div>

      <noscript>
        <div class="mobile-menu-fallback">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">{% translate "Home" %}</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">{% translate "About" %}</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'new_here' %}">{% translate "New here?" %}</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'giving' %}">{% translate "Give" %}</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'sermons:list' %}">{% translate "Sermons" %}</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'communications:subscribe' %}">{% translate "Stay connected" %}</a></li>
          </ul>
        </div>
      </noscript>

      <form
        class="language-switcher language-item"
        action="{% url 'set_language' %}"
        method="post"
        x-data="{ language: '{{ current_language }}' }"
      >
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <fieldset>
          <legend class="visually-hidden">{% translate "Choose language" %}</legend>
          <div class="language-rocker" aria-label="{% translate 'Choose language' %}">
            <label class="language-label" for="language-toggle">English</label>
            <input
              id="language-toggle"
              class="language-toggle"
              type="checkbox"
              role="switch"
              :checked="language === 'es'"
              aria-checked="{% if current_language == 'es' %}true{% else %}false{% endif %}"
              :aria-checked="language === 'es'"
              aria-label="{% translate 'Toggle between English and Spanish' %}"
              @change="language = $event.target.checked ? 'es' : 'en'; $refs.languageInput.value = language; $event.target.form.submit()"
            >
            <label class="language-track" for="language-toggle" aria-hidden="true"><span class="language-thumb"></span></label>
            <label class="language-label" for="language-toggle">Español</label>
            <input x-ref="languageInput" type="hidden" value="{{ current_language }}" x-bind:name="'language'">
          </div>
          <noscript>
            <label for="language-select" class="visually-hidden">{% translate "Choose language" %}</label>
            <select id="language-select" name="language">
              <option value="en"{% if current_language == 'en' %} selected{% endif %}>English</option>
              <option value="es"{% if current_language == 'es' %} selected{% endif %}>Español</option>
            </select>
            <button type="submit">{% translate "Change language" %}</button>
          </noscript>
        </fieldset>
      </form>
    </div>
  </nav>
</header>
