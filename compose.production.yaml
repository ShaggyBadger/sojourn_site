services:
  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn --bind 127.0.0.1:8000 sojourn.wsgi:application"
    env_file:
      - .env.production
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./staticfiles:/app/staticfiles
